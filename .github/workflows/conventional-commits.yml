# Valida Conventional Commits nos PRs sem depender de Node no projeto.
# Backstop do husky/commitlint (que só existe quando o projeto tem Node).
name: conventional-commits
on:
  pull_request:
# Least privilege: o default do repositorio pode ser read/write, e em
# repositorio publico isso e superficie de graca (delta-066).
permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verificar mensagens de commit
        # base_ref sai do run: e entra por env: expressao dentro do script e
        # substituida no texto antes do shell, entao nome de branch viraria
        # codigo em PR de fork (delta-069). Por env, o shell le como dado.
        env:
          BASE_REF: ${{ github.base_ref }}
          # Commits ja na develop com subject fora do padrao e historia imutavel:
          # os squashes da #568 e da #578 sairam com o titulo de merge commit e
          # pai unico, e o --no-merges nao os pula. Excecao por SHA completo,
          # nunca por padrao de mensagem; saem depois da v1.65.0, quando ficam
          # abaixo da main (DT-273).
          EXCECOES: >-
            64fface43c143c228441b2b479568db776e232c8
            6a86bbf5d1b40a2294e63be164cf36d6e478d70d
        run: |
          commits=$(git log --no-merges --format=%H "origin/$BASE_REF..HEAD")
          subjects=$(while IFS= read -r commit; do
            if [ -z "$commit" ] || git diff-tree --quiet --no-commit-id -r "$commit"; then
              continue
            fi
            case " $EXCECOES " in *" $commit "*) continue ;; esac
            subject=$(git show -s --format=%s "$commit")
            if printf '%s' "$subject" | grep -qE '^Update .+'; then
              files=()
              while IFS= read -r -d '' file; do
                files+=("$file")
              done < <(git diff-tree --no-commit-id --name-only -r -z "$commit")
              if [ "${#files[@]}" -eq 1 ] && [ "$subject" = "Update ${files[0]}" ]; then
                continue
              fi
            fi
            printf '%s\n' "$subject"
          done <<< "$commits")
          if [ -n "$subjects" ]; then
            bad=$(printf '%s\n' "$subjects" \
              | grep -vE '^(feat|fix|docs|refactor|chore|ci|test|style|perf|build|revert)(\([^)]+\))?!?: .+' || true)
          else
            bad=
          fi
          if [ -n "$bad" ]; then
            echo "Commits fora do padrão Conventional Commits:"
            echo "$bad"
            exit 1
          fi

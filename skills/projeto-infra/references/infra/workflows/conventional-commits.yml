# Valida Conventional Commits nos PRs sem depender de Node no projeto.
# Backstop do husky/commitlint (que só existe quando o projeto tem Node).
name: conventional-commits
on:
  pull_request:
# Least privilege: o default do repositorio pode ser read/write, e em
# repositorio publico isso e superficie de graca (delta-066).
permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@{{SHA:actions/checkout@v4}} # v4
        with:
          fetch-depth: 0
      - name: Verificar mensagens de commit
        # base_ref sai do run: e entra por env: expressao dentro do script e
        # substituida no texto antes do shell, entao nome de branch viraria
        # codigo em PR de fork (delta-069). Por env, o shell le como dado.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          commits=$(git log --no-merges --format=%H "origin/$BASE_REF..HEAD")
          subjects=$(while IFS= read -r commit; do
            if [ -z "$commit" ] || git diff-tree --quiet --no-commit-id -r "$commit"; then
              continue
            fi
            git show -s --format=%s "$commit"
          done <<< "$commits")
          if [ -n "$subjects" ]; then
            bad=$(printf '%s\n' "$subjects" \
              | grep -vE '^(feat|fix|docs|refactor|chore|ci|test|style|perf|build|revert)(\([^)]+\))?!?: .+' || true)
          else
            bad=
          fi
          if [ -n "$bad" ]; then
            echo "Commits fora do padrão Conventional Commits:"
            echo "$bad"
            exit 1
          fi
